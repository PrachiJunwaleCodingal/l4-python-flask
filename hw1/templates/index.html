<!DOCTYPE html>
<html>
<head><title>Vowel Counter</title></head>
<body>
    <h2>Vowel Counter</h2>
    <form method="POST">
        <input type="text" name="text" value="{{ text }}" required placeholder="Enter text here...">
        <button type="submit">Count Vowels</button>
    </form>
    {% if count is not none %}
        <h3>Number of vowels: {{ count }}</h3>
    {% endif %}
</body>
</html>
